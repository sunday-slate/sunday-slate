[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    # Permissive
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    # "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",

    # File-level copyleft, AGPL-compatible
    "MPL-2.0",

    # GNU family compatible with AGPL-3.0
    # "AGPL-3.0",
    "AGPL-3.0-or-later",
    # "GPL-3.0",
    # "GPL-3.0-or-later",
    # "LGPL-3.0",
    # "LGPL-3.0-or-later",
    # "GPL-2.0-or-later",
    "LGPL-2.1-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
skip = [
    # Windows targets — never compiled on Linux/macOS
    { name = "windows-sys" },
    { name = "windows-targets" },
    { name = "windows_aarch64_gnullvm" },
    { name = "windows_aarch64_msvc" },
    { name = "windows_i686_gnu" },
    { name = "windows_i686_gnullvm" },
    { name = "windows_i686_msvc" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_x86_64_gnullvm" },
    { name = "windows_x86_64_msvc" },
    { name = "wit-bindgen" },
    # Ecosystem version splits caused by tower-sessions-sqlx-store lag
    { name = "rand" },
    { name = "rand_chacha" },
    { name = "thiserror" },
    { name = "thiserror-impl" },
    { name = "tower-sessions-core" },
    # Common transitive splits
    { name = "getrandom" },
    { name = "hashbrown" },
    { name = "heck" },
    { name = "r-efi" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
