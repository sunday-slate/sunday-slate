name: Nix
on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "Cargo.lock"
      - "crates/**"
      - ".github/workflows/nix.yml"
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (actions/checkout)
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1 (cachix/install-nix-action)
      - name: Flake check
        # Builds the package, evals nixosModules, runs the VM test on linux.
        # The aarch64-darwin leg has no x86_64-linux checks (see flake.nix),
        # so darwin checks = drains + package build only.
        run: nix flake check -L --keep-going
      - name: Build the package
        run: nix build .#sunday-slate
      - name: Push closure to cachix (synchronous)
        # Explicit CLI push so the upload completes inside this step: the
        # closure exists before anything else consumes the rev, and the
        # lock-bump job can treat success as a gate (buffered action-side
        # pushes are not a commit gate).
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix profile install nixpkgs#cachix
          cachix push sunday-slate result
