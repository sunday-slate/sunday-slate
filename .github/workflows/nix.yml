name: Nix
on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".sqlx/**"
      - ".github/workflows/nix.yml"
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".sqlx/**"
      - ".github/workflows/nix.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - name: Check the flake and service module
        run: nix flake check -L
      - name: Build the package
        run: nix build .#sunday-slate -L
