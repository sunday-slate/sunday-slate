name: Nix lock bump
# Keeps main's flake.lock aligned with nixos-unstable so default consumers
# stay on cache-hit paths. Order is load-bearing: update the lock first,
# then only commit if the whole build + cache push is green — main's lock
# never leads the cache.
on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nix-bump
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (actions/checkout)
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1 (cachix/install-nix-action)
      - name: Update the nixpkgs input
        id: update
        run: |
          nix flake update nixpkgs
          if git diff --exit-code -- flake.lock > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build gate (build + VM test on linux)
        if: steps.update.outputs.changed == 'true'
        run: nix flake check -L --keep-going
      - name: Push closure to cachix
        if: steps.update.outputs.changed == 'true'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17 (cachix/cachix-action)
        with:
          name: sunday-slate
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Commit the bumped lock
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: bump nixpkgs lock (automatic)"
          git push
