name: Nix lock bump
# Keeps main's flake.lock aligned with nixos-unstable so default consumers
# stay on cache-hit paths. Order is load-bearing: update the lock, prove the
# build, push the linux closure synchronously, and only then commit — main's
# lock never leads its linux cache. The fresh lock's macOS closure is built
# right after the commit via an explicit workflow_dispatch (baked GITHUB_
# TOKEN pushes don't trigger the matrix workflow on their own; explicit
# dispatches do).
on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write # for the nix.yml dispatch caching the fresh lock's mac leg
concurrency:
  group: nix-bump
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (actions/checkout)
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1 (cachix/install-nix-action)
      - name: Update the nixpkgs input
        id: update
        run: |
          nix flake update nixpkgs
          if git diff --exit-code -- flake.lock > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build gate (build + VM test on linux)
        if: steps.update.outputs.changed == 'true'
        run: nix flake check -L --keep-going
      - name: Push the fresh-lock closure (synchronous)
        if: steps.update.outputs.changed == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix profile install nixpkgs#cachix
          nix build .#sunday-slate
          cachix push sunday-slate result
      - name: Commit the bumped lock
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: bump nixpkgs lock (automatic)"
          git push
      - name: Cache the fresh lock's macOS closure
        # GITHUB_TOKEN push events do not trigger nix.yml's matrix; run it
        # explicitly so macOS users get the new lock from cache within
        # minutes of the commit.
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run nix.yml --ref main --repo "${{ github.repository }}"
