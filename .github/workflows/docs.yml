name: Docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".config/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (actions/checkout)
      # Quartz serves the homepage from content/index.md; the vault uses
      # Index.md and stays untouched (Obsidian), so normalize in the run.
      - name: Normalize homepage name
        run: |
          if [ -f docs/Index.md ] && [ ! -f docs/index.md ]; then
            mv docs/Index.md docs/index.md
          fi
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5 (actions/configure-pages)
      - name: Build Quartz site
        uses: konstfish/quartz-build-action@90deba2e46e844e315c283da46ede5f464a2d202 # v7 (konstfish/quartz-build-action)
        with:
          source: docs
          page_title: Sunday Slate Docs
          quartz_config: .config/quartz.config.ts
          quartz_layout: .config/quartz.layout.ts
          quartz_custom_css: .config/quartz-custom.scss
          quartz_repo_ref: v4.5.2 # deliberate Quartz upgrade lever; "v4" tracks the branch head
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 (actions/upload-pages-artifact)
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 (actions/deploy-pages)
