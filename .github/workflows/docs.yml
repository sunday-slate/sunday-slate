name: Docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".config/mkdocs.yml"
      - "scripts/repo_links.py"
      - "crates/fanduel-data/**"
      - "crates/nfl-model/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".sqlx/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (actions/checkout)
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rustdoc
      - name: Install Rust build tools
        # The workspace's Linux linker configuration uses mold.
        run: |
          sudo apt-get update
          sudo apt-get install --yes mold
      - name: Build Rust API docs
        run: cargo doc --locked -p fanduel-data -p nfl-model
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (actions/setup-python)
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/docs.yml
      - name: Build MkDocs site
        # Pin matches python3Packages.mkdocs-material at the flake's pinned
        # nixpkgs input; bump both together.
        run: |
          pip install "mkdocs-material==9.7.7"
          mkdocs build --strict -f .config/mkdocs.yml
      - name: Include Rust API docs in Pages site
        run: |
          mkdir -p _site/rustdoc
          cp -a target/doc/. _site/rustdoc/
          test -f _site/rustdoc/fanduel_data/index.html
          test -f _site/rustdoc/nfl_model/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 (actions/upload-pages-artifact)
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 (actions/deploy-pages)
