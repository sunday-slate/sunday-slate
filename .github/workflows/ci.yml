name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # With no toolchain argument, rustup reads rust-toolchain.toml.
        run: rustup toolchain install --no-self-update

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install build tools
        env:
          # Matches tailwindcss_4 in the pinned Nix development shell.
          TAILWIND_VERSION: "4.3.3"
        run: |
          sudo apt-get update
          sudo apt-get install --yes mold
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWIND_VERSION}/tailwindcss-linux-x64" \
            --output "${RUNNER_TEMP}/tailwindcss"
          echo "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a  ${RUNNER_TEMP}/tailwindcss" \
            | sha256sum --check
          sudo install --mode=755 "${RUNNER_TEMP}/tailwindcss" /usr/local/bin/tailwindcss

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --locked
