<!doctype html>
<html lang="en" data-theme="sundayslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NFL Data Admin{% endblock %} · Sunday Slate</title>
  <link rel="stylesheet" href="/nfl-data-admin/static/css/admin.css">
  <script defer src="/nfl-data-admin/static/vendor/js/htmx.min.js"></script>
</head>
<body class="min-h-screen bg-base-200 font-sans text-base-content">
  <header class="border-b border-base-300 bg-base-100">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-5 py-5">
      <a class="text-lg font-semibold tracking-tight" href="/nfl-data-admin">NFL Data Admin</a>
      <a href="/">Sunday Slate</a>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-5 py-10">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
