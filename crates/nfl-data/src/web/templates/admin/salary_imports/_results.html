{% for row in rows %}<article class="card mb-3 border border-base-300 bg-base-100 p-4"><div class="flex flex-wrap justify-between gap-3"><div class="font-semibold">{{ row.fd_name }}</div><p class="text-sm text-base-content/70">{{ row.fd_team }} · {{ row.original_position }} · ${{ row.salary }} · {{ row.state.as_str() }}</p></div>{% if group.as_str() == "resolved" || group.as_str() == "skipped" %}<form method="post" action="/nfl-data-admin/salary-imports/{{ import_id }}/rows/{{ row.id }}/undo"><button class="btn btn-sm btn-ghost">Undo</button></form>{% endif %}</article>{% else %}<p class="text-base-content/70">No rows in this review group.</p>{% endfor %}
