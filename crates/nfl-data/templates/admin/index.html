{% extends "admin/layout.html" %}

{% block title %}NFL Data Admin{% endblock %}

{% block content %}
<section class="max-w-2xl">

  <p class="mt-4 max-w-xl text-base leading-7 text-base-content/70">Manage the shared football data that powers Sunday Slate.</p>
