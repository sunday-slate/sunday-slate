{% extends "app.html" %}
{% block content %}
<div class="card border border-base-300 bg-base-100">
  <div class="card-body items-center gap-4">
    {% match logo %}
    {% when Some with (logo) %}
    <div class="avatar">
      <div class="size-32 rounded-full">
        <img src="{{ logo.url() }}" alt="Team logo">
      </div>
    </div>
    {% when None %}
    <div class="avatar avatar-placeholder">
      <div class="size-32 rounded-full bg-accent/15 text-accent">
        <span class="text-4xl">{{ self.monogram() }}</span>
      </div>
    </div>
    {% endmatch %}

    <form method="post" action="/teams/{{ team_id }}/logo" enctype="multipart/form-data" class="flex w-full max-w-sm flex-col gap-2">
      <label for="team-logo" class="sr-only">Team logo</label>
      <input id="team-logo" type="file" name="logo" accept="image/png,image/jpeg,image/webp"
             class="file-input w-full" required>
      <p class="text-xs text-base-content/50">PNG, JPEG, or WebP, up to 5 MB. Cropped to a square.</p>
      <div class="flex gap-2">
        <button type="submit" class="btn btn-primary btn-sm">Upload logo</button>
        {% if logo.is_some() %}
        <button type="submit" name="remove" formnovalidate class="btn btn-ghost btn-sm">Remove</button>
        {% endif %}
      </div>
    </form>
  </div>
</div>
{% endblock %}
