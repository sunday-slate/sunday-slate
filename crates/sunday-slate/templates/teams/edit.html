{% extends "app.html" %}
{% import "partials/team_fields.html" as fields %}
{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="mb-1 text-2xl font-semibold tracking-tight">Edit team</h1>
  <p class="mb-5 text-sm text-base-content/60">
    Update your fantasy team details.
  </p>

  <div class="card border border-base-300 bg-base-100 shadow-sm">
    <div class="card-body">
      <form method="post" action="/teams/{{ team_id }}/edit"
            hx-post="/teams/{{ team_id }}/edit"
            hx-swap="innerMorph"
            class="flex flex-col gap-4">
        {% block form %}
        {% call fields::name_fields(name, owner_name, errors) %}{% endcall %}
        <button type="submit" class="btn btn-primary mt-2">Save</button>
        {% endblock %}
      </form>
    </div>
  </div>
</div>
{% endblock %}
