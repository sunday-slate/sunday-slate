{% extends "app.html" %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <h1 class="mb-4 text-2xl font-bold">Resolve FanDuel player {{ fd_player_id }}</h1>
  <form method="get" action="/admin/salary-imports/{{ week }}/players/{{ fd_player_id }}" class="mb-4 flex gap-2">
    {% if results.widened %}<input type="hidden" name="scope" value="all">{% endif %}
    <input class="input input-bordered flex-1" name="q" value="{{ query }}" placeholder="Search players by name">
    <button class="btn btn-outline" type="submit">Search</button>
  </form>
  {% include "admin/salary_imports/_results.html" %}
</div>
{% endblock %}
