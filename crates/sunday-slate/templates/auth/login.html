{% extends "layout.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="mb-1 text-2xl font-semibold tracking-tight">Sign in</h1>
  <p class="mb-5 text-sm text-base-content/60"></p>

  {% block form %}
  <div id="login-card">
    {% if let Some(error) = error %}
    <div role="alert" class="alert alert-error mb-4">
      <i class="ph ph-warning-circle text-lg"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <div class="card border border-base-300 bg-base-100 shadow-sm">
      <div class="card-body">
        <form method="post" action="/login"
              hx-post="/login" hx-target="#login-card" hx-swap="outerMorph"
              class="flex flex-col gap-4">
          {% if let Some(next) = next %}
          <input type="hidden" name="next" value="{{ next }}">
          {% endif %}
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Email</legend>
            <input type="email" name="email" required autocomplete="email"
                   class="input w-full" placeholder="you@example.com">
          </fieldset>
          <fieldset class="fieldset">
            <legend class="fieldset-legend">Password</legend>
            <input type="password" name="password" required autocomplete="current-password"
                   class="input w-full" placeholder="••••••••">
          </fieldset>
          <button type="submit" class="btn btn-primary mt-2">Sign in</button>
        </form>
      </div>
    </div>
  </div>
  {% endblock %}

  <p class="mt-4 text-center text-sm">
    <a href="/forgot-password" class="link link-hover">Forgot your password?</a>
  </p>
</div>
{% endblock %}
