{% extends "layout.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="mb-1 text-2xl font-semibold tracking-tight">Reset password</h1>
  <p class="mb-5 text-sm text-base-content/60">Enter your email and we'll send you a reset link.</p>

  <div class="card border border-base-300 bg-base-100 shadow-sm">
    <div class="card-body">
      <form method="post" action="/forgot-password"
            hx-post="/forgot-password"
            class="flex flex-col gap-4">
        {% block form %}
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Email</legend>
          <input type="email" name="email" required autocomplete="email"
                 value="{{ email }}"
                 class="input w-full" placeholder="you@example.com">
          {% for msg in errors.field("email") %}
          <p class="label text-xs text-error">{{ msg }}</p>
          {% endfor %}
        </fieldset>
        <button type="submit" class="btn btn-primary mt-2">Send reset link</button>
        {% endblock %}
      </form>
    </div>
  </div>


  <p class="mt-4 text-center text-sm">
    <a href="/login" class="link link-hover">Back to sign in</a>
  </p>
</div>
{% endblock %}
