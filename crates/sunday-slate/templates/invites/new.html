{% extends "app.html" %}
{% block content %}
<div class="mx-auto max-w-sm">
  <p class="mb-5 text-sm text-base-content/60">
    Send an email invite to join the league.
  </p>
  <div class="card border border-base-300 bg-base-100 shadow-sm">
    <div class="card-body">
      <form method="post" action="/invites" hx-post="/invites" hx-swap="innerMorph"
            class="flex flex-col gap-4">
        {% block form %}
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Email address</legend>
          <input type="email" name="email" required value="{{ email }}"
                 class="input w-full" placeholder="friend@example.com">
          {% for msg in errors.field("email") %}
          <p class="label text-xs text-error">{{ msg }}</p>
          {% endfor %}
        </fieldset>
        <button type="submit" class="btn btn-primary mt-2">Send invite</button>
        {% endblock %}
      </form>
    </div>
  </div>
</div>
{% endblock %}
