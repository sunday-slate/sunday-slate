# Dev server job: rebuild + restart on changes to Rust sources and templates.
# Tailwind CSS is handled by a separate `tailwindcss --watch` (see `just dev`),
# because bacon runs one job at a time and CSS-only edits are served from disk
# without a server restart.
default_job = "serve"

# `--bin sunday-slate` is required, not decorative: the crate also builds the
# `fd-import` binary, so a bare `-p sunday-slate` is ambiguous and cargo refuses
# to run anything.
[jobs.serve]
command = ["cargo", "run", "--bin", "sunday-slate"]
watch = ["crates/sunday-slate/templates"]
need_stdout = true
background = false
on_change_strategy = "kill_then_restart"
